<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejercicio 12 - Conversor de Cambio</title>
    <link rel="stylesheet" href="css/ejercicio12.css">
</head>
<body>

    <div class="contenedor">
        <h1>Conversor de Cambio</h1>
        <p class="subtitulo">Ingresa la distancia en pesos MXN y obtén su equivalente en dolar USD.</p>

        <form class="formulario" id="formulario">
            <div class="grupo-formulario">
                <label for="pesos">Pesos</label>
                <input 
                    type="text" 
                    id="pesos" 
                    placeholder="Ej: 500" 
                    autocomplete="off">
            </div>

            <button type="button" class="boton-convertir" id="btnConvertir">
                Convertir
            </button>

            <div class="grupo-formulario">
                <label for="dolares">Resultado en dolares</label>
                <input 
                    type="text" 
                    id="dolares" 
                    placeholder="Aquí aparecerá el resultado" 
                    readonly>
            </div>

            <p class="mensaje-error" id="mensajeError"></p>
        </form>
    </div>

    <script src="js/ejercicio12.js"></script>
</body>
</html>
