<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejercicio 13 - Verificar Votación</title>
    <link rel="stylesheet" href="css/ejercicio13.css">
</head>
<body>

    <div class="contenedor">
        <h1>¿Puedes Votar?</h1>
        <p class="subtitulo">Ingresa tu edad y verifica si cumples con la mayoría de edad para votar.</p>

        <form class="formulario" id="formulario">
            <div class="grupo-formulario">
                <label for="edad">Edad</label>
                <input 
                    type="text" 
                    id="edad" 
                    placeholder="Ej: 20" 
                    autocomplete="off">
            </div>

            <button type="button" class="boton-convertir" id="btnVerificar">
                Verificar
            </button>

            <div class="grupo-formulario">
                <label for="resultado">Resultado</label>
                <input 
                    type="text" 
                    id="resultado" 
                    placeholder="Aquí aparecerá el resultado" 
                    readonly>
            </div>

            <p class="mensaje-error" id="mensajeError"></p>
        </form>
    </div>

    <script src="js/ejercicio13.js"></script>
</body>
</html>
