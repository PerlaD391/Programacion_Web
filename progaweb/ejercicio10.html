<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejercicio 10 - Conversor Celsius a Fahrenheit</title>
    <link rel="stylesheet" href="css/ejercicio10.css">
</head>
<body>

    <div class="contenedor">
        <h1>Conversor de Temperatura</h1>
        <p class="subtitulo">Ingresa grados Celsius y obtén su equivalente en Fahrenheit.</p>

        <form class="formulario" id="formulario">
            <div class="grupo-formulario">
                <label for="celsius">Grados Celsius (°C)</label>
                <input 
                    type="text" 
                    id="celsius" 
                    placeholder="Ej: 25" 
                    autocomplete="off">
            </div>

            <button type="button" class="boton-convertir" id="btnConvertir">
                Convertir
            </button>

            <div class="grupo-formulario">
                <label for="fahrenheit">Resultado en Fahrenheit (°F)</label>
                <input 
                    type="text" 
                    id="fahrenheit" 
                    placeholder="Aquí aparecerá el resultado" 
                    readonly>
            </div>

            <p class="mensaje-error" id="mensajeError"></p>
        </form>
    </div>

    <script src="js/ejercicio10.js"></script>
</body>
</html>
